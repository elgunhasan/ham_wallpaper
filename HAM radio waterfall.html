    W = cv.width = bg.width = fgc.width = Math.round(innerWidth * DPR); H = cv.height = bg.height = fgc.height = Math.round(innerHeight * DPR);
    TOP = Math.round(H * .6); drawBg(); drawFg();
  }
  addEventListener('resize', resize); resize();

  function render() {
    cx.clearRect(0, 0, W, H); cx.imageSmoothingEnabled = true;
    cx.drawImage(wf, 0, TOP, W, H - TOP);
    var fh = (H - TOP) * .33, g = cx.createLinearGradient(0, TOP, 0, TOP + fh);
    g.addColorStop(0, 'rgba(9,22,31,1)'); g.addColorStop(1, 'rgba(9,22,31,0)'); cx.fillStyle = g; cx.fillRect(0, TOP, W, fh);
    var sc = H * .22, base = TOP - 3 * DPR, i;
    cx.beginPath(); cx.moveTo(0, base);
    for (i = 0; i < NB; i++) cx.lineTo(i * W / (NB - 1), base - Math.max(0, tr[i] - .15) * sc);
    cx.lineTo(W, base); cx.closePath(); cx.fillStyle = 'rgba(242,163,58,.18)'; cx.fill();
    cx.beginPath();
    for (i = 0; i < NB; i++) { var x = i * W / (NB - 1), y = base - Math.max(0, tr[i] - .15) * sc; i ? cx.lineTo(x, y) : cx.moveTo(x, y); }
    cx.strokeStyle = '#f7b252'; cx.lineWidth = 2 * DPR; cx.stroke();
    var u = Math.floor(frame / UNIT_FRAMES) % keyUnits.length;
    els.forEach(function (e) { e.el.classList.toggle('on', u >= e.start && u < e.start + e.len); });
  }

  function step() { newRow(); wc.drawImage(wf, 0, 0, NB, NR - 1, 0, 1, NB, NR - 1); wc.putImageData(row, 0, 0); frame++; }
  var last = 0, acc = 0;
  function loop(t) {
    requestAnimationFrame(loop);
    if (document.hidden) { last = t; return; }
    acc += t - last; last = t;
    if (acc < 1000 / FPS) return;
    acc = Math.min(acc - 1000 / FPS, 1000 / FPS);
    step(); render();
  }
  var savedN = nextSweep, savedT = nextText; nextSweep = nextText = 1e9;     // no events while pre-filling
  for (var w = 0; w < NR; w++) step();
  frame = 0; nextSweep = savedN; nextText = savedT;
  requestAnimationFrame(loop);
})();
</script>
